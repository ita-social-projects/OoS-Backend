# Trigger extracts the commit timestamp as _COMMIT_DATE_RAW from $(commit.commit.committer.date) event payload
# and uses bash variable expansion to convert it to _COMMIT_DATE as ${_COMMIT_DATE_RAW//:/-}
steps:
# Build the container image
- name: 'buildpacksio/pack'
  entrypoint: 'pack'
  args:
    - build
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/outofschool/oos-auth:$SHORT_SHA
    - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/outofschool/oos-auth:$SHORT_SHA-${_COMMIT_DATE}
    - --cache-image=${_REGION}-docker.pkg.dev/$PROJECT_ID/outofschool/oos-cache:auth
    - --buildpack=paketo-buildpacks/dotnet-core
    - --buildpack=paketo-buildpacks/environment-variables
    - --builder=paketobuildpacks/builder-jammy-base:latest
    - --env=BP_DOTNET_PROJECT_PATH=./OutOfSchool/OutOfSchool.AuthorizationServer/
    - --env=BPE_AppDefaults__Version=$SHORT_SHA
    - --publish
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
